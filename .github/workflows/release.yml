name: Release Balce Inventory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Gives the workflow permission to write releases and upload assets
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # Important because of frontend submodule

      # 1. Setup Go Environment
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Create bin directory
        run: mkdir -p src-tauri/bin

      # 2. Compile Go Sidecars from within the backend directory
      - name: Build Go Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          SIDECAR_LDFLAGS: "-s -w -X 'github.com/chrisostomemataba/balceinv-api/license.LicenseSecret=${{ secrets.BALCE_LICENSE_SECRET }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportPasscodeHash=${{ secrets.SUPPORT_PASSCODE_HASH }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportSmtpPassword=${{ secrets.SUPPORT_SMTP_PASSWORD }}'"
        run: |
          cd backend
          go build -trimpath -ldflags="-H=windowsgui $SIDECAR_LDFLAGS" -o ../src-tauri/bin/backend-x86_64-pc-windows-msvc.exe ./cmd/server

      - name: Build Go Sidecar (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          SIDECAR_LDFLAGS: "-s -w -X 'github.com/chrisostomemataba/balceinv-api/license.LicenseSecret=${{ secrets.BALCE_LICENSE_SECRET }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportPasscodeHash=${{ secrets.SUPPORT_PASSCODE_HASH }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportSmtpPassword=${{ secrets.SUPPORT_SMTP_PASSWORD }}'"
        run: |
          cd backend
          go build -trimpath -ldflags="$SIDECAR_LDFLAGS" -o ../src-tauri/bin/backend-x86_64-unknown-linux-gnu ./cmd/server

      - name: Build Go Sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          SIDECAR_LDFLAGS: "-s -w -X 'github.com/chrisostomemataba/balceinv-api/license.LicenseSecret=${{ secrets.BALCE_LICENSE_SECRET }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportPasscodeHash=${{ secrets.SUPPORT_PASSCODE_HASH }}' -X 'github.com/chrisostomemataba/balceinv-api/internal/config.CompiledSupportSmtpPassword=${{ secrets.SUPPORT_SMTP_PASSWORD }}'"
        run: |
          cd backend
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags="$SIDECAR_LDFLAGS" -o ../src-tauri/bin/backend-x86_64-apple-darwin ./cmd/server
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags="$SIDECAR_LDFLAGS" -o ../src-tauri/bin/backend-aarch64-apple-darwin ./cmd/server

      # 3. Setup pnpm and Node Environment
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Required for pnpm 11's internal dependency structures
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      # 4. Setup Rust Compilation Toolchain
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 5. Native OS Dependency Bundling
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # 6. Build frontend and bundle Tauri Application
      - name: Install frontend dependencies
        run: pnpm --prefix frontend install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Balce Inventory ${{ github.ref_name }}"
          releaseBody: "See the assets below for downloads."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}