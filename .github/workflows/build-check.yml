name: Build check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-apple-silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            label: macos-intel
          - platform: ubuntu-22.04
            args: ''
            label: linux
          - platform: windows-latest
            args: ''
            label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test the backend
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd backend
          go vet ./...
          go test ./... -count=1

      - name: Create bin directory
        run: mkdir -p src-tauri/bin

      - name: Build Go Sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd backend
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o ../src-tauri/bin/backend-x86_64-pc-windows-msvc.exe ./cmd/server

      - name: Build Go Sidecar (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd backend
          go build -trimpath -ldflags="-s -w" -o ../src-tauri/bin/backend-x86_64-unknown-linux-gnu ./cmd/server

      - name: Build Go Sidecar (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          cd backend
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../src-tauri/bin/backend-x86_64-apple-darwin ./cmd/server
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../src-tauri/bin/backend-aarch64-apple-darwin ./cmd/server

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node.js + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm --prefix frontend install

      - name: Check the translations
        if: matrix.platform == 'ubuntu-22.04'
        run: node --experimental-strip-types frontend/scripts/locales.check.ts

      - name: Build the desktop app (no release, no signing)
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: balce-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 14
